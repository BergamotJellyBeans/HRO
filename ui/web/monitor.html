<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pi5-HRO Live Monitor</title>

<style>
@font-face {
    font-family: 'HRO-Nunito';
    src: url('/assets/fonts/NunitoSans-VariableFont.ttf') format('truetype');
    font-style: normal;
    font-weight: 200 1000;
}

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#monitor {
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    display: block;
}

#audioControls {
    position: fixed;
    z-index: 10;
    font-family: 'HRO-Nunito', sans-serif;
    color: #f4f7f8;
    transform-origin: top left;
    box-sizing: border-box;
    background: #000;
    border: 1px solid #fff;
}
#audioControls .controlTitle {
    position: absolute; left: 0; width: 100%; text-align: center;
    font-size: 16px; font-weight: 700;
}
#audioControls button {
    position: absolute; padding: 0; background: #000; color: #fff;
    border: 1px solid #fff; font: 700 16px 'HRO-Nunito', sans-serif;
    cursor: pointer;
}
#audioControls button:active { background: #263c49; }
#audioControls output {
    position: absolute; left: 88px; width: 72px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #00dfff;
}
#displayMinus { left: 9px; top: 25px; width: 78px; height: 32px; }
#displayPlus { left: 161px; top: 25px; width: 78px; height: 32px; }
#audioMinus { left: 9px; top: 83px; width: 62px; height: 38px; }
#audioPlus { left: 177px; top: 83px; width: 62px; height: 38px; }
#audioToggle { left: 64px; top: 127px; width: 120px; height: 28px; }
#audioControls button.muted { border-color: #ff4040; color: #ff4040; }
</style>
</head>

<body>

<canvas id="monitor" width="1280" height="720"></canvas>

<div id="audioControls">
    <div class="controlTitle" style="top:2px">DISPLAY LEVEL</div>
    <button id="displayMinus">LEVEL-</button>
    <output id="displayLevel" style="top:25px">0 dB</output>
    <button id="displayPlus">LEVEL+</button>
    <div class="controlTitle" style="top:63px">AUDIO</div>
    <button id="audioMinus">VOL-</button>
    <output id="audioVolume" style="top:86px">25%</output>
    <button id="audioPlus">VOL+</button>
    <button id="audioToggle" class="muted">MUTED</button>
</div>

<script>

// ============================================================
// Monitor layout constants (1280 x 720)
// ============================================================

// Time-scroll area
const SCROLL_LEFT  = 48;
const SCROLL_RIGHT = 1248;
const SCROLL_TOP   = 98;

// Time axis
const TIME_AXIS_Y = 108;

// Waterfall image area
const WATERFALL_TOP    = 125;
const WATERFALL_BOTTOM = 360;
const LEVEL_TOP    = WATERFALL_BOTTOM + 10;  // 370
const LEVEL_H      = 80;
const LEVEL_BOTTOM = LEVEL_TOP + LEVEL_H;    // 450

// Display duration
const DISPLAY_SECONDS = 1200;

const WATERFALL_WIDTH  = SCROLL_RIGHT - SCROLL_LEFT;
const WATERFALL_HEIGHT = WATERFALL_BOTTOM - WATERFALL_TOP;

// ============================================================
// Monitor state
// ============================================================

const canvas = document.getElementById('monitor');
const ctx = canvas.getContext('2d');

const baseImage = new Image();

let config = null;
let liveSocket = null;

const WATERFALL_SECONDS = DISPLAY_SECONDS;

const waterfallCanvas = document.createElement('canvas');

// 内部では 1 pixel = 1 second
waterfallCanvas.width  = WATERFALL_SECONDS;
waterfallCanvas.height = WATERFALL_HEIGHT;

const waterfallCtx = waterfallCanvas.getContext('2d');

const staticCanvas = document.createElement('canvas');
staticCanvas.width  = 1280;
staticCanvas.height = 720;

const staticCtx = staticCanvas.getContext('2d');

// Peak level graph
const LEVEL_DB_MIN = -10.0;
const LEVEL_DB_MAX =  30.0;

const levelCanvas = document.createElement('canvas');
levelCanvas.width  = WATERFALL_SECONDS; // 600秒
levelCanvas.height = LEVEL_H;

const levelCtx = levelCanvas.getContext('2d');

function levelDbToY(db)
{
    if (db < LEVEL_DB_MIN)
        db = LEVEL_DB_MIN;
    else if (db > LEVEL_DB_MAX)
        db = LEVEL_DB_MAX;

    const normalized =
        (db - LEVEL_DB_MIN) /
        (LEVEL_DB_MAX - LEVEL_DB_MIN);

    return LEVEL_H - 1 -
        Math.floor(normalized * (LEVEL_H - 1));
}

function addLivePeakBar(peakValue)
{
    // 1秒分左へスクロール
    levelCtx.drawImage(
        levelCanvas,
        1, 0,
        WATERFALL_SECONDS - 1, LEVEL_H,
        0, 0,
        WATERFALL_SECONDS - 1, LEVEL_H
    );

    // 新しい1秒領域をクリア
    const x = WATERFALL_SECONDS - 1;

    levelCtx.clearRect(
        x,
        0,
        1,
        LEVEL_H
    );

    // Tab5と同じdB → Y変換
    const y = levelDbToY(peakValue);

    // Waterfallと同じ色
    levelCtx.fillStyle =
        waterfallColor(peakValue);

    // 下端から上方向へバーを描画
    levelCtx.fillRect(
        x,
        y,
        1,
        LEVEL_H - y
    );
}

let audioSocket = null;
let audioContext = null;
let audioGain = null;
let nextAudioTime = 0;

const AUDIO_SAMPLE_RATE = 8192;

function updateAudioButtons(isOn)
{
    const button = document.getElementById('audioToggle');
    button.textContent = isOn ? 'MUTE' : 'MUTED';
    button.classList.toggle('muted', !isOn);
}

async function startAudio()
{
    if (!audioContext)
    {
        audioContext = new AudioContext();

        audioGain = audioContext.createGain();
        audioGain.gain.value = audioVolume;
        audioGain.connect(audioContext.destination);
    }

    if (audioContext.state === 'suspended')
        await audioContext.resume();

    nextAudioTime = audioContext.currentTime + 0.1;

    connectAudioWebSocket();
}

function stopAudio()
{
    if (audioSocket)
    {
        audioSocket.close();
        audioSocket = null;
    }

    nextAudioTime = 0;
}

function connectAudioWebSocket()
{
    if (audioSocket &&
        (audioSocket.readyState === WebSocket.OPEN ||
         audioSocket.readyState === WebSocket.CONNECTING))
    {
        return;
    }

    const host = window.location.hostname;
    const url = `ws://${host}:8082`;

    console.log('Connecting AUDIO WebSocket:', url);

    audioSocket = new WebSocket(url);
    audioSocket.binaryType = 'arraybuffer';

    audioSocket.onopen = () =>
    {
        console.log('AUDIO WebSocket connected');
        consoleMessage('Audio connected');

        updateAudioButtons(true);

        if (audioContext)
        {
            nextAudioTime = audioContext.currentTime + 0.1;
        }
    };

    audioSocket.onclose = (event) =>
    {
        console.log(
            'AUDIO WebSocket disconnected',
            event.code,
            event.reason
        );

        audioSocket = null;
        consoleMessage(event.code === 1000 ? "Audio stopped" : "Audio disconnected", event.code === 1000 ? "info" : "warning");

        updateAudioButtons(false);

    };

    audioSocket.onerror = (event) =>
    {
        console.error('AUDIO WebSocket error', event);
        consoleMessage('Audio connection error', 'error');
    };

    audioSocket.onmessage = (event) =>
    {
        if (!(event.data instanceof ArrayBuffer))
            return;

        const samples = new Float32Array(event.data);

        if (samples.length !== 256)
        {
            console.error(
                'Invalid AUDIO packet:',
                samples.length,
                'samples'
            );
            return;
        }

        playAudioSamples(samples);
    };
}

function playAudioSamples(samples)
{
    if (!audioContext || !audioGain)
        return;

    const buffer =
        audioContext.createBuffer(
            1,
            samples.length,
            AUDIO_SAMPLE_RATE
        );

    buffer.getChannelData(0).set(samples);

    const source = audioContext.createBufferSource();

    source.buffer = buffer;
    source.connect(audioGain);

    const now = audioContext.currentTime;

    if (nextAudioTime < now ||
        nextAudioTime > now + 0.5)
    {
        if (nextAudioTime) consoleMessage("Audio buffering: playback timing reset", "warning");
        nextAudioTime = now + 0.1;
    }

    source.start(nextAudioTime);

    nextAudioTime +=
        samples.length / AUDIO_SAMPLE_RATE;
}

let displayLevel = 0;
let audioVolume = 1;
try {
    const saved = Number(localStorage.getItem('hro.audioVolume') ?? 1);
    if (Number.isFinite(saved)) audioVolume = Math.max(0, Math.min(4, saved));
} catch (_) {}
let saveTimer = null;
let savePending = false;
let saving = false;
let lastDataAt = 0;
let observationTimeMs = null;
let clockSource = "--";
let dataInterrupted = false;
let liveReconnect = null;
let monitorReady = false;
const consoleLines = [];

function consoleMessage(text, level = 'info')
{
    const time = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit'
    }).format(new Date());
    const previous = consoleLines[consoleLines.length - 1];
    if (previous && previous.text === text && previous.level === level) {
        previous.count++; previous.time = time;
    } else {
        consoleLines.push({text, level, time, count: 1});
        if (consoleLines.length > 9) consoleLines.shift();
    }
    console.log(`[Pi5] ${text}`);
    if (monitorReady) drawMonitor();
}
function drawConsole()
{
    ctx.save();
    ctx.fillStyle = '#000'; ctx.fillRect(10, 480, 1000, 195);
    ctx.strokeStyle = '#38434b'; ctx.strokeRect(10.5, 480.5, 999, 194);
    ctx.beginPath(); ctx.rect(14, 484, 992, 187); ctx.clip();
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = '600 14px "HRO-Nunito"';
    consoleLines.forEach((line, i) => {
        ctx.fillStyle = line.level === 'error' ? '#ff4040' : line.level === 'warning' ? '#ffff00' : '#20dff3';
        ctx.fillText(`${line.time} [Pi5] ${line.text}${line.count > 1 ? ` (x${line.count})` : ''}`, 14, 484 + i * 20);
    });
    ctx.restore();
}
function updateDisplayLevel()
{
    document.getElementById('displayLevel').textContent = `${displayLevel > 0 ? '+' : ''}${displayLevel} dB`;
}
function updateVolume()
{
    document.getElementById('audioVolume').textContent = `${Math.round(audioVolume * 25)}%`;
    if (audioGain) audioGain.gain.value = audioVolume;
    try { localStorage.setItem('hro.audioVolume', audioVolume); } catch (_) {}
}
async function saveDisplayLevel()
{
    if (saving) { savePending = true; return; }
    saving = true; savePending = false;
    const level = displayLevel;
    try {
        const response = await fetch('/api/display', {method: 'POST',
            headers: {'Content-Type': 'application/json'}, body: JSON.stringify({level_db: level})});
        if (!response.ok) throw new Error('Save failed');
        consoleMessage(`Display Level saved: ${level} dB`);
    } catch (_) { consoleMessage('Display Level save failed; press LEVEL to retry', 'error'); }
    finally { saving = false; if (savePending) saveDisplayLevel(); }
}
function changeDisplayLevel(step)
{
    const level = Math.max(-30, Math.min(30, displayLevel + step));
    if (level === displayLevel) return;
    displayLevel = level; updateDisplayLevel();
    // Existing canvas pixels retain the colour used when they arrived.
    consoleMessage(`Display Level: ${level} dB`);
    clearTimeout(saveTimer); saveTimer = setTimeout(saveDisplayLevel, 2000);
}
document.getElementById('displayMinus').onclick = () => changeDisplayLevel(-1);
document.getElementById('displayPlus').onclick = () => changeDisplayLevel(1);
document.getElementById('audioMinus').onclick = () => { audioVolume = Math.max(0, audioVolume - 0.4); updateVolume(); };
document.getElementById('audioPlus').onclick = () => { audioVolume = Math.min(4, audioVolume + 0.4); updateVolume(); };
document.getElementById('audioToggle').onclick = async () => {
    if (audioSocket) { stopAudio(); updateAudioButtons(false); consoleMessage('Audio muted'); }
    else { try { await startAudio(); } catch (_) { consoleMessage('Audio playback could not start', 'error'); } }
};
updateAudioButtons(false); updateVolume();

let lastObservationState = null;
let lastPngId = null;
async function pollMonitorStatus()
{
    try {
        const response = await fetch('/api/system/status');
        if (!response.ok) throw new Error();
        const status = await response.json();
        clockSource = ["NTP", "RTC"].includes(status.time_source) ? status.time_source : "--";
        if (monitorReady) drawMonitor();
        if (status.observation !== lastObservationState) {
            consoleMessage(`Observation: ${status.observation.toUpperCase()}`,
                status.observation === 'running' ? 'info' : 'warning');
            lastObservationState = status.observation;
        }
        const pngResponse = await fetch('/api/monitor/png');
        if (!pngResponse.ok) throw new Error();
        const png = await pngResponse.json();
        if (png.timestamp_ms && png.timestamp_ms !== lastPngId) {
            const incomplete = Number.isInteger(png.missing_seconds) && png.missing_seconds > 0;
            consoleMessage(`PNG ${png.saved ? 'saved' : 'save failed'}: ${png.filename}${png.saved && incomplete ? ' (incomplete)' : ''}`,
                !png.saved ? 'error' : incomplete ? 'warning' : 'info');
            lastPngId = png.timestamp_ms;
        }
    } catch (_) { consoleMessage('System status unavailable', 'warning'); }
}
setInterval(() => {
    if (lastDataAt && Date.now() - lastDataAt > 3000 && !dataInterrupted) {
        dataInterrupted = true; consoleMessage('Observation data interrupted', 'warning');
    }
}, 1000);

function connectLiveWebSocket()
{
    const host = window.location.hostname;
    const url = `ws://${host}:8081`;

    console.log('Connecting LIVE WebSocket:', url);

    liveSocket = new WebSocket(url);

    liveSocket.onopen = () =>
    {
        console.log('LIVE WebSocket connected');
        consoleMessage('Live connection established');
    };

    liveSocket.onclose = (event) =>
    {
        console.log(
            'LIVE WebSocket disconnected',
            event.code,
            event.reason
        );
        consoleMessage('Live disconnected; reconnecting', 'warning');
        clearTimeout(liveReconnect);
        liveReconnect = setTimeout(connectLiveWebSocket, 3000);
    };

    liveSocket.onerror = (event) =>
    {
        console.error('LIVE WebSocket error', event);
        consoleMessage('Live connection error', 'error');
    };

    liveSocket.onmessage = (event) =>
    {
        try
        {
            const message = JSON.parse(event.data);

            if (message.type !== 'fft')
                return;

            if (!Array.isArray(message.fft) ||
                message.fft.length !== 601) // 501->601
            {
                console.error(
                    'Invalid LIVE FFT data:',
                    message
                );
                return;
            }


            if (!lastDataAt || dataInterrupted) consoleMessage(lastDataAt ? 'Observation data resumed' : 'Observation data receiving');
            lastDataAt = Date.now(); dataInterrupted = false;
            if (Number.isFinite(message.timestamp) && message.timestamp >= 946684800000 && message.timestamp < 4102444800000)
                observationTimeMs = message.timestamp;
            addLiveWaterfallLine(message.fft);
            addLivePeakBar(message.peak);

            drawMonitor();
        }
        catch (error)
        {
            console.error(
                'LIVE message parse error:',
                error
            );
        }
    };
}

function scrollWaterfall()
{
    waterfallCtx.drawImage(
        waterfallCanvas,
        1, 0,
        WATERFALL_SECONDS - 1, WATERFALL_HEIGHT,
        0, 0,
        WATERFALL_SECONDS - 1, WATERFALL_HEIGHT
    );

    waterfallCtx.clearRect(
        WATERFALL_SECONDS - 1,
        0,
        1,
        WATERFALL_HEIGHT
    );
}

function waterfallColor(db)
{
    const DB_MIN = -20.0;
    const DB_MAX =  30.0;

    let t = (db - DB_MIN) / (DB_MAX - DB_MIN);

    t = Math.max(0.0, Math.min(1.0, t));

    let r = 0;
    let g = 0;
    let b = 0;

    // dark blue -> blue -> cyan -> yellow -> white
    if (t < 0.25)
    {
        const u = t / 0.25;
        r = 0;
        g = 0;
        b = 30 + 180 * u;
    }
    else if (t < 0.50)
    {
        const u = (t - 0.25) / 0.25;
        r = 0;
        g = 220 * u;
        b = 220;
    }
    else if (t < 0.75)
    {
        const u = (t - 0.50) / 0.25;
        r = 255 * u;
        g = 220;
        b = 220 * (1.0 - u);
    }
    else
    {
        const u = (t - 0.75) / 0.25;
        r = 255;
        g = 220 + 35 * u;
        b = 255 * u;
    }

    return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
}

function addLiveWaterfallLine(fft)
{
    // Waterfallを1秒分左へスクロール
    scrollWaterfall();

    const x = WATERFALL_SECONDS - 1;
    const binCount = fft.length;

    // 601 FFT binsをWaterfallの縦方向へ描画
    for (let y = 0; y < WATERFALL_HEIGHT; ++y)
    {
        // 上側 = 高い周波数
        // fft[0] = 低周波側、fft[500] = 高周波側
        const ratio =
            1.0 - y / (WATERFALL_HEIGHT - 1);

        const bin =
            Math.round(ratio * (binCount - 1));

        const value = fft[bin];

        waterfallCtx.fillStyle =
            waterfallColor(value + displayLevel);

        waterfallCtx.fillRect(
            x,
            y,
            1,
            1
        );
    }
}

async function loadConfig()
{
    const response = await fetch('/api/config');

    if (!response.ok)
        throw new Error('Failed to load configuration');

    config = await response.json();
}

function decimalToDMSString(value, positiveDir, negativeDir)
{
    const direction = value >= 0 ? positiveDir : negativeDir;
    const absValue = Math.abs(value);

    const deg = Math.floor(absValue);
    const minFloat = (absValue - deg) * 60.0;
    const min = Math.floor(minFloat);
    const sec = (minFloat - min) * 60.0;

    return `${deg}° ${min}' ${sec.toFixed(1)}" ${direction}`;
}

function drawInfo(label, value, x, labelY, valueY, valueSize = 14)
{
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // Label
    ctx.font = '600 10px "HRO-Nunito"';
    ctx.fillStyle = '#28d7f2';
    ctx.fillText(label, x, labelY);

    // Value
    ctx.font = `600 ${valueSize}px "HRO-Nunito"`;
    ctx.fillStyle = '#f4f7f8';
    ctx.fillText(value, x, valueY);
}

function drawStaticLayer()
{
    drawSystemInfo();
    drawStationInfo();
    drawFrequencyAxis();
    drawLevelScale();
}

function drawSystemInfo()
{
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    ctx.font = '600 14px "HRO-Nunito"';
    ctx.fillStyle = '#20dff3';

    ctx.fillText(
        'Pi5-HRO   v0.1   Raspberry Pi 5 + RTL-SDR',
        10,
        695
    );
}

function drawFrequencyAxis()
{
    const center = config.receiver.fft_center_hz;
    const range  = config.receiver.fft_range_hz;

    const topY    = WATERFALL_TOP;
    const bottomY = WATERFALL_BOTTOM;

    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    ctx.font = '600 10px "HRO-Nunito"';
    ctx.fillStyle = '#20dff3';
    ctx.strokeStyle = '#20dff3';
    ctx.lineWidth = 1;

    // Major ticks every 100 Hz
    const tickHz = 100;

    const maxFrequency = center + range;
    const minFrequency = center - range;

    // First 100 Hz tick inside the upper edge
    const firstTick =
        Math.floor(maxFrequency / tickHz) * tickHz;

    for (let frequency = firstTick;
         frequency >= minFrequency;
        frequency -= tickHz)
    {
        const ratio =
            (maxFrequency - frequency) / (2 * range);

        let y = topY + (bottomY - topY) * ratio;

        // Tick
        ctx.beginPath();
        ctx.moveTo(SCROLL_LEFT - 5, y);
        ctx.lineTo(SCROLL_LEFT - 1, y);
        ctx.stroke();

        // Label
        ctx.fillText(
            frequency.toString(),
            SCROLL_LEFT - 8,
            y
        );
    }
}

function drawLevelScale()
{
    const values = [20, 10, 0, -10];

    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '600 10px "HRO-Nunito"';
    ctx.fillStyle = '#28d7f2';

    for (const db of values)
    {
        const y = LEVEL_TOP + levelDbToY(db);

        ctx.beginPath();
        ctx.moveTo(SCROLL_LEFT-5, y);
        ctx.lineTo(SCROLL_LEFT-1, y);
        ctx.stroke();

        ctx.fillText(
            `${db > 0 ? '+' : ''}${db}`,
            40, y
        );
    }
}

function timeToX(timeMs, nowMs)
{
    const ageSec = (nowMs - timeMs) / 1000.0;

    return SCROLL_RIGHT -
        ageSec *
        (SCROLL_RIGHT - SCROLL_LEFT) /
        DISPLAY_SECONDS;
}

function drawTimeAxis(now)
{
    const nowMs = now.getTime();

    ctx.strokeStyle = '#20dff3';
    ctx.fillStyle   = '#20dff3';
    ctx.lineWidth   = 1;

    ctx.font = '600 10px "HRO-Nunito"';
    ctx.textBaseline = 'bottom';

    // 現在時刻より2分未来から開始
    // → 次の時刻目盛りが右側からスクロールして入ってくる
    const tick = new Date(now);
    tick.setSeconds(0, 0);
    tick.setMinutes(tick.getMinutes() + 2);

    // 表示時間 + 2分先行分
    const displayMinutes =
        Math.ceil(DISPLAY_SECONDS / 60);

    const tickMinutes =
        displayMinutes + 2;

    for (let i = 0; i <= tickMinutes; ++i)
    {
        const t =
            new Date(tick.getTime() - i * 60000);

        const x =
            timeToX(t.getTime(), nowMs);

        if (x < SCROLL_LEFT || x > SCROLL_RIGHT)
            continue;

        const major =
            (t.getMinutes() % 2 === 0);

        ctx.beginPath();
        ctx.moveTo(x, TIME_AXIS_Y);
        ctx.lineTo(
            x,
            TIME_AXIS_Y + (major ? 7 : 4)
        );
        ctx.stroke();

        if (major)
        {
            const hh =
                String(t.getHours()).padStart(2, '0');

            const mm =
                String(t.getMinutes()).padStart(2, '0');

            ctx.textAlign = 'center';

            ctx.fillText(
                `${hh}:${mm}`,
                x,
                TIME_AXIS_Y - 3
            );
        }
    }
}

function buildStaticLayer()
{
    ctx.clearRect(0, 0, 1280, 720);
    ctx.drawImage(baseImage, 0, 0, 1280, 720);

    drawSystemInfo();

    if (!config)
        return;

    const longitude = decimalToDMSString(
        config.station.longitude, 'E', 'W'
    );

    const latitude = decimalToDMSString(
        config.station.latitude, 'N', 'S'
    );

    const gain =
        (config.receiver.sdr_gain / 10.0).toFixed(1) + ' dB';


    const frequencyMHz =
        (config.receiver.frequency_hz / 1000000.0).toFixed(6) + ' MHz';

    const fft =
        config.receiver.fft_center_hz +
        ' +/-' +
        config.receiver.fft_range_hz +
        ' Hz';

    drawInfo(
        'OBSERVER',
        config.station.observer,
        485, 24, 43, 13
    );

    drawInfo(
        'RECEIVING LOCATION',
        config.station.location,
        485, 57, 75, 13
    );

    drawInfo(
        'LONGITUDE',
        longitude,
        785, 24, 43, 11
    );

    drawInfo(
        'LATITUDE',
        latitude,
        785, 57, 75, 11
    );

    drawInfo(
        'RECEIVER',
        config.receiver.receiver,
        905, 24, 43, 12
    );

    drawInfo(
        'ANTENNA',
        config.receiver.antenna,
        905, 57, 75, 12
    );

    drawInfo(
        'GAIN',
        gain,
        1050, 24, 43, 12
    );

    drawInfo(
        'RECEIVING FREQUENCY',
        frequencyMHz,
        1120, 24, 43, 12
    );

    drawInfo(
        'FFT CENTER / RANGE',
        fft,
        1120, 57, 75, 12
    );

    drawLevelScale();
    drawFrequencyAxis();

    // 完成した固定画面を保存
    staticCtx.clearRect(0, 0, 1280, 720);
    staticCtx.drawImage(canvas, 0, 0);
}

function drawObservationClock()
{
    ctx.save();
    ctx.fillStyle = clockSource === 'RTC' ? '#a05000' : '#003c78';
    ctx.fillRect(540, 678, 250, 25);
    ctx.fillStyle = '#fff';
    ctx.font = '600 14px "HRO-Nunito"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // Render the observation timestamp in JST; never substitute the browser clock.
    const text = observationTimeMs === null ? `--/--/--  --:--:-- [${clockSource}]` :
        new Date(observationTimeMs + 9 * 3600000).toISOString().slice(0, 19)
            .replace(/-/g, '/').replace('T', '  ') + ` [${clockSource}]`;
    ctx.fillText(text, 665, 690.5);
    ctx.restore();
}

function drawMonitor()
{
    ctx.clearRect(0, 0, 1280, 720);

    // 完成済みの固定画面
    ctx.drawImage(staticCanvas, 0, 0);

    // Waterfall
    ctx.drawImage(
        waterfallCanvas,
        0, 0,
        WATERFALL_SECONDS, WATERFALL_HEIGHT,
        SCROLL_LEFT, WATERFALL_TOP,
        SCROLL_RIGHT - SCROLL_LEFT,
        WATERFALL_HEIGHT
    );

    // Peak
    ctx.drawImage(
        levelCanvas,
        0, 0,
        WATERFALL_SECONDS, LEVEL_H,
        SCROLL_LEFT, LEVEL_TOP,
        SCROLL_RIGHT - SCROLL_LEFT, LEVEL_H
    );

    // 時刻だけ毎回更新
    drawTimeAxis(new Date());
    drawConsole();
    drawObservationClock();
}

function positionAudioControls()
{
    const canvas =
        document.getElementById('monitor');

    const controls =
        document.getElementById('audioControls');

    const r = canvas.getBoundingClientRect();

    // 1280x720を基準とした表示倍率
    const scale = r.width / 1280;

    // Audio操作領域（1280x720基準座標）
    const x = 1014;
    const y = 520;
    const w = 250;
    const h = 161;

    // 位置だけ実画面座標へ変換
    controls.style.left =
        (r.left + x * scale) + 'px';

    controls.style.top =
        (r.top + y * scale) + 'px';

    // Audio領域自体は1280x720基準サイズのまま
    controls.style.width = w + 'px';
    controls.style.height = h + 'px';

    // 中身を含めて全部まとめて拡大縮小
    controls.style.transform =
        `scale(${scale})`;
}

window.addEventListener('resize', positionAudioControls);

baseImage.onload = async () =>
{
    try
    {
        await loadConfig();
        const displayResponse = await fetch('/api/display');
        if (!displayResponse.ok) throw new Error('Failed to load Display Level');
        displayLevel = (await displayResponse.json()).level_db;
        updateDisplayLevel();
        consoleMessage('Configuration loaded');

        // Canvasで使用するNunito Sansを明示的にロード
        await document.fonts.load('600 10px "HRO-Nunito"');
        await document.fonts.load('600 13px "HRO-Nunito"');

        buildStaticLayer();
        monitorReady = true;
        drawMonitor();
        
        positionAudioControls();
        connectLiveWebSocket();
        pollMonitorStatus();
        setInterval(pollMonitorStatus, 10000);
    }
    catch (error)
    {
        console.error('Monitor initialization failed:', error);
        monitorReady = true;
        consoleMessage(error.message, 'error');
    }
};

baseImage.src = '/assets/radio_meteor_observation_base_1280x720.png';
</script>
