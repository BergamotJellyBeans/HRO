<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pi5-HRO Station Settings</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 760px;
    margin: auto;
    background: white;
    padding: 28px;
    border-radius: 10px;
}

h1 {
    margin-top: 0;
}

fieldset {
    margin-bottom: 22px;
    padding: 18px;
    border: 1px solid #bbb;
    border-radius: 6px;
}

legend {
    font-weight: bold;
}

.row {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
}

input,
select {
    padding: 7px;
    font-size: 15px;
}

.actions {
    margin-top: 20px;
    text-align: right;
}

#saveButton {
    padding: 10px 24px;
    font-size: 15px;
    cursor: pointer;
}

.status {
    margin-top: 15px;
    font-size: 14px;
}

.dms {
    display: grid;
    grid-template-columns: 70px 18px 70px 18px 90px 18px 60px;
    gap: 4px;
    align-items: center;
}

.dms input,
.dms select {
    box-sizing: border-box;
    width: 100%;
    padding: 7px;
    font-size: 15px;
}

</style>
</head>

<body>

<div class="container">

<h1>Pi5-HRO Station Settings</h1>

<fieldset>
<legend>Station</legend>

<div class="row">
<label>Observer</label>
<input id="observer">
</div>

<div class="row">
<label>Receiving Location</label>
<input id="location">
</div>

<div class="row">
<label>Longitude</label>
<div class="dms">
    <input id="longitude_deg" type="number" min="0" max="180">
    <span>°</span>
    <input id="longitude_min" type="number" min="0" max="59">
    <span>′</span>
    <input id="longitude_sec" type="number" min="0" max="59.999" step="0.001">
    <span>″</span>
    <select id="longitude_dir">
        <option value="E">E</option>
        <option value="W">W</option>
    </select>
</div>
</div>

<div class="row">
<label>Latitude</label>
<div class="dms">
    <input id="latitude_deg" type="number" min="0" max="90">
    <span>°</span>
    <input id="latitude_min" type="number" min="0" max="59">
    <span>′</span>
    <input id="latitude_sec" type="number" min="0" max="59.999" step="0.001">
    <span>″</span>
    <select id="latitude_dir">
        <option value="N">N</option>
        <option value="S">S</option>
    </select>
</div>

</fieldset>


<fieldset>
<legend>Receiver</legend>

<div class="row">
<label>Receiver</label>
<input id="receiver">
</div>

<div class="row">
<label>Receiving Frequency (MHz)</label>
<input id="frequency_hz" type="number" step="0.000001">
</div>

<div class="row">
<label>SDR Gain (dB)</label>
<select id="sdr_gain">
    <option value="0">0.0</option>
    <option value="9">0.9</option>
    <option value="14">1.4</option>
    <option value="27">2.7</option>
    <option value="37">3.7</option>
    <option value="77">7.7</option>
    <option value="87">8.7</option>
    <option value="125">12.5</option>
    <option value="144">14.4</option>
    <option value="157">15.7</option>
    <option value="166">16.6</option>
    <option value="197">19.7</option>
    <option value="207">20.7</option>
    <option value="229">22.9</option>
    <option value="254">25.4</option>
    <option value="280">28.0</option>
    <option value="297">29.7</option>
    <option value="328">32.8</option>
    <option value="338">33.8</option>
    <option value="364">36.4</option>
    <option value="372">37.2</option>
    <option value="386">38.6</option>
    <option value="402">40.2</option>
    <option value="421">42.1</option>
    <option value="434">43.4</option>
    <option value="439">43.9</option>
    <option value="445">44.5</option>
    <option value="480">48.0</option>
    <option value="496">49.6</option>
</select>
</div>

<div class="row">
<label>FFT Center Frequency (Hz)</label>
<input id="fft_center_hz" type="number">
</div>

<div class="row">
<label>Level Peak Range +/- (Hz)</label>
<input id="level_peak_range_hz" type="number">
</div>

<div class="row">
<label>Receiving Antenna</label>
<input id="antenna">
</div>

</fieldset>

<fieldset>
<legend>Screenshot</legend>

<div class="row">
<label>File Prefix</label>
<input id="prefix">
</div>

</fieldset>

<div class="actions">
    <button id="saveButton" type="button">
        Save Settings
    </button>
</div>

<div class="status" id="status">Loading...</div>

</div>

<script>

function decimalToDMS(value)
{
    const absValue = Math.abs(value);

    const deg = Math.floor(absValue);
    const minFloat = (absValue - deg) * 60.0;
    const min = Math.floor(minFloat);
    const sec = (minFloat - min) * 60.0;

    return {
        deg: deg,
        min: min,
        sec: sec
    };
}

function dmsToDecimal(deg, min, sec, direction)
{
    let value =
        Number(deg) +
        Number(min) / 60.0 +
        Number(sec) / 3600.0;

    if (direction === 'W' || direction === 'S')
        value = -value;

    return value;
}

async function loadConfig()
{
    try
    {
        const response = await fetch('/api/config');

        if (!response.ok)
            throw new Error('HTTP ' + response.status);

        const config = await response.json();

        document.getElementById('observer').value =
            config.station.observer;

        document.getElementById('location').value =
            config.station.location;

        const lon = decimalToDMS(config.station.longitude);

        document.getElementById('longitude_deg').value = lon.deg;
        document.getElementById('longitude_min').value = lon.min;
        document.getElementById('longitude_sec').value = lon.sec.toFixed(3);
        document.getElementById('longitude_dir').value =
            config.station.longitude >= 0 ? 'E' : 'W';

        const lat = decimalToDMS(config.station.latitude);

        document.getElementById('latitude_deg').value = lat.deg;
        document.getElementById('latitude_min').value = lat.min;
        document.getElementById('latitude_sec').value = lat.sec.toFixed(3);
        document.getElementById('latitude_dir').value =
            config.station.latitude >= 0 ? 'N' : 'S';

        document.getElementById('receiver').value =
            config.receiver.receiver;

        document.getElementById('frequency_hz').value =
            (config.receiver.frequency_hz / 1000000).toFixed(6);

        document.getElementById('sdr_gain').value =
            config.receiver.sdr_gain;

        document.getElementById('fft_center_hz').value =
            config.receiver.fft_center_hz;

        document.getElementById('level_peak_range_hz').value =
            config.receiver.level_peak_range_hz;

        document.getElementById('antenna').value =
            config.receiver.antenna;

        document.getElementById('prefix').value =
            config.screenshot.prefix;

        document.getElementById('status').textContent =
            'Configuration loaded.';
    }
    catch (error)
    {
        document.getElementById('status').textContent =
            'Failed to load configuration: ' + error;
    }
}

document.getElementById('saveButton').addEventListener('click', async function()
{
    const longitude = dmsToDecimal(
        document.getElementById('longitude_deg').value,
        document.getElementById('longitude_min').value,
        document.getElementById('longitude_sec').value,
        document.getElementById('longitude_dir').value
    );

    const latitude = dmsToDecimal(
        document.getElementById('latitude_deg').value,
        document.getElementById('latitude_min').value,
        document.getElementById('latitude_sec').value,
        document.getElementById('latitude_dir').value
    );

    const config = {
        station: {
            observer: document.getElementById('observer').value,
            location: document.getElementById('location').value,
            latitude: latitude,
            longitude: longitude
        },

        receiver: {
            receiver: document.getElementById('receiver').value,
            frequency_hz:
                Math.round(
                    Number(document.getElementById('frequency_hz').value) * 1000000
                ),
            sdr_gain:
                Number(document.getElementById('sdr_gain').value),
            fft_center_hz:
                Number(document.getElementById('fft_center_hz').value),
            level_peak_range_hz:
                Number(document.getElementById('level_peak_range_hz').value),
            antenna:
                document.getElementById('antenna').value
        },

        screenshot: {
            prefix:
                document.getElementById('prefix').value
        }
    };

    console.log(config);

    try
    {
        const response = await fetch('/api/config', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(config)
        });

        const result = await response.json();

        if (!response.ok)
            throw new Error(result.error || 'Failed to save configuration');

        document.getElementById('status').textContent =
            'Configuration saved.';
    }
    catch (error)
    {
        document.getElementById('status').textContent =
            'Save failed: ' + error.message;
    }

    });

loadConfig();

</script>

</body>
</html>
