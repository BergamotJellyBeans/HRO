<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pi5-HRO Archive Viewer</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #00dfff;
    font-family: Arial, sans-serif;
}

body {
    text-align: center;
}

header {
    padding: 16px;
}

h1 {
    margin: 0 0 10px 0;
    font-size: 24px;
}

#archiveImage {
    display: block;
    width: min(1280px, 100vw);
    height: auto;
    margin: 0 auto;
}

#selectors {
    margin: 8px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

#selectors label {
    display: flex;
    align-items: center;
    gap: 6px;
}

#selectors select {
    padding: 4px 8px;
    font-size: 14px;
}

#archiveListArea {
    width: min(1280px, 96vw);
    margin: 8px auto 0 auto;
    text-align: left;

    height: calc(100vh - 700px);
    min-height: 180px;

    overflow-y: auto;
    overflow-x: hidden;
}

#archiveListArea h2 {
    margin: 0 0 12px 0;
    font-size: 20px;
}

.archive-date {
    margin-top: 14px;
    margin-bottom: 5px;
    font-size: 16px;
    color: #ffffff;
}

.archive-times {
    display: grid;
    grid-template-columns: repeat(12, 56px);
    column-gap: 0;
    line-height: 18px;
}

.archive-time {
    color: #66ff88;
    text-decoration: underline;
    cursor: pointer;
    background: none; border: 0; padding: 0; font-size: inherit;
}

.archive-time.partial { color: #ffcd70; }
.archive-time.metadata-error { color: #ff9c9c; }
.archive-time:hover {
    color: #ffffff;
}

.archive-time.current {
    color: #00dfff;
    font-weight: bold;
}

.archive-missing {
    color: #666666;
}

.archive-time,
.archive-missing {
    display: block;
    width: 56px;
    text-align: left;
    font-family: monospace;
}

#metadata {
    width: min(1280px, 96vw);
    margin: 6px auto;
    text-align: left;
    font-family: monospace;
    font-size: 13px;
    line-height: 18px;
    color: #cccccc;
    white-space: pre-wrap;
}

#navigation {
    margin: 12px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

#navigation button {
    padding: 7px 16px;
    font-size: 14px;
    cursor: pointer;
}

#navigation button:disabled {
    opacity: 0.35;
    cursor: default;
}

#status {
    min-width: 220px;
    margin: 0;
}

a {
    color: #00dfff;
}
#viewMode { padding: 8px; }
#viewMode button { padding: 8px 20px; margin: 0 5px; }
#viewMode button[aria-pressed="true"] { background: #00dfff; color: #000; }
#hroView { width: min(1280px, 96vw); margin: auto; text-align: left; }
#hroView[hidden], #pngView[hidden] { display: none; }
#hroControls { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
#hroFile { max-width: min(760px, 90vw); }
#hroCanvas, #spectrumCanvas { width: 100%; height: auto; background: #080d18; }
#hroView button, #hroView select { padding: 7px; }
#recordSlider { width: min(700px, 90%); }
#hroStatus, #recordDetails { white-space: pre-wrap; line-height: 1.6; color: #ddd; }
#hroView p { color: #bbb; }
/* Keep history loading distinct from image/record navigation. */
.archive-history {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 12px 20px; padding: 14px 16px; margin: 12px 0 16px;
    border: 1px solid #277082; border-radius: 8px; background: #061923;
}
.history-range { color: #e2f4f8; font-size: 15px; line-height: 1.5; }
#archiveOlder, #hroOlder {
    min-height: 46px; padding: 12px 20px; border: 2px solid #00dfff;
    border-radius: 7px; background: #00dfff; color: #00141b;
    font: bold 16px Arial, sans-serif; cursor: pointer; opacity: 1;
}
#archiveOlder:hover:not(:disabled), #hroOlder:hover:not(:disabled) {
    background: #8df2ff; border-color: #8df2ff;
}
#archiveOlder:focus-visible, #hroOlder:focus-visible {
    outline: 3px solid #ffffff; outline-offset: 4px;
}
#archiveOlder:disabled, #hroOlder:disabled { cursor: default; opacity: 1; }
#archiveOlder[data-state="complete"], #hroOlder[data-state="complete"] {
    background: #103424; border-color: #66df9c; color: #a7f4c7;
}
#archiveOlder[data-state="loading"], #hroOlder[data-state="loading"] {
    background: #153746; border-color: #5ba1b5; color: #e2f4f8;
}
@media (max-width: 640px) {
    #archiveOlder, #hroOlder { width: 100%; }
}
</style>
</head>

<body>

<header>
    <h1>Pi5-HRO Archive Viewer</h1>
    <a href="/monitor">LIVE Monitor</a>
</header>

<nav id="viewMode" aria-label="Archive display">
<button id="pngMode" aria-pressed="true">PNG / JSON</button>
<button id="hroMode" aria-pressed="false">HRO / FFT</button>
</nav>
<section id="hroView" hidden>
<h2>HRO / FFT</h2>
<div id="hroControls">
<label>File <select id="hroFile"></select></label>
<button id="hroRefresh">Refresh</button>
<button id="hroPrevious">◀ Previous records</button>
<button id="hroNext">Next records ▶</button>
</div>
<div class="archive-history">
<div id="hroRange" class="history-range" role="status"></div>
<button id="hroOlder" class="load-older" type="button" disabled>Load Older Archives (+30 Days)</button>
</div>
<div id="hroStatus" role="status">Select HRO / FFT to load files.</div>
<p>Times are JST. Recording and partial files are available. Each column is one FFT in generation order; missing legacy slots are blank.</p>
<canvas id="hroCanvas" width="1280" height="380" aria-label="FFT waterfall in generation order"></canvas>
<label>FFT record <input id="recordSlider" type="range" min="0" max="0" value="0" disabled></label>
<div id="recordDetails"></div>
<canvas id="spectrumCanvas" width="1280" height="230" aria-label="Selected FFT spectrum"></canvas>
</section>
<section id="pngView">
<div id="selectors">
    <label>
        Date
        <select id="dateSelect"></select>
    </label>

    <label>
        Time
        <select id="timeSelect"></select>
    </label>
</div>

<div id="navigation">
    <button id="previousButton">◀ Previous</button>
    <span id="status">Loading latest observation...</span>
    <button id="nextButton">Next ▶</button>
</div>

<img id="archiveImage" alt="HRO archive image">

<div id="metadata">
    Metadata: loading...
</div>

<div id="archiveListArea">
    <h2>Image List</h2>
    <div class="archive-history">
        <div id="archiveRange" class="history-range" role="status"></div>
        <button id="archiveOlder" class="load-older" type="button" disabled>Load Older Archives (+30 Days)</button>
    </div>
    <div id="archiveLinks"></div>
</div>

</section>
<script>
let archiveList = [];
let currentIndex = -1;
let metadataRequest = 0;
let archiveBefore = null, archiveLoading = false, archiveStart = '', archiveEnd = '';

function qualityLabel(item) {
    if (item.quality === "partial") return `Partial ${item.received_seconds}/${item.expected_seconds}s`;
    if (item.quality === "metadata_error") return "Metadata unavailable";
    return "";
}


function parseArchiveFilename(filename)
{
    // ファイル名末尾の YYYYMMDDHHMM.png を取り出す。
    // Station IDの長さには依存しない。
    const match = filename.match(/(\d{12})\.png$/);

    if (!match)
        return null;

    const s = match[1];

    return {
        dateKey: s.slice(0, 8),
        dateLabel:
            `${s.slice(0, 4)}/${s.slice(4, 6)}/${s.slice(6, 8)}`,
        timeKey: s.slice(8, 12),
        timeLabel:
            `${s.slice(8, 10)}:${s.slice(10, 12)}`
    };
}


function populateDates()
{
    const dateSelect =
        document.getElementById('dateSelect');

    dateSelect.innerHTML = '';

    const seen = new Set();

    for (const item of archiveList)
    {
        const info =
            parseArchiveFilename(item.png_file);

        if (!info)
            continue;

        if (seen.has(info.dateKey))
            continue;

        seen.add(info.dateKey);

        const option =
            document.createElement('option');

        option.value =
            info.dateKey;

        option.textContent =
            info.dateLabel;

        dateSelect.appendChild(option);
    }
}


function populateTimes(dateKey, selectedIndex = -1)
{
    const timeSelect =
        document.getElementById('timeSelect');

    timeSelect.innerHTML = '';

    for (let i = 0; i < archiveList.length; ++i)
    {
        const info =
            parseArchiveFilename(
                archiveList[i].png_file);

        if (!info)
            continue;

        if (info.dateKey !== dateKey)
            continue;

        const option =
            document.createElement('option');

        option.value =
            String(i);

        option.textContent =
            info.timeLabel + (qualityLabel(archiveList[i]) ? " · " + qualityLabel(archiveList[i]) : "");

        if (i === selectedIndex)
            option.selected = true;

        timeSelect.appendChild(option);
    }
}


function updateSelectors()
{
    if (currentIndex < 0 ||
        currentIndex >= archiveList.length)
        return;

    const info =
        parseArchiveFilename(
            archiveList[currentIndex].png_file);

    if (!info)
        return;

    const dateSelect =
        document.getElementById('dateSelect');

    dateSelect.value =
        info.dateKey;

    populateTimes(
        info.dateKey,
        currentIndex);
}


function updateArchiveLinkHighlight()
{
    const links =
        document.querySelectorAll('.archive-time');

    for (const link of links)
    {
        const index =
            Number(link.dataset.index);

        link.classList.toggle(
            'current',
            index === currentIndex);
    }
}


function showArchive(index)
{
    if (index < 0 ||
        index >= archiveList.length)
        return;

    currentIndex = index;

    const item =
        archiveList[currentIndex];

    document.getElementById('status').textContent =
        item.png_file + (qualityLabel(item) ? " · " + qualityLabel(item) : "");

    const image = document.getElementById('archiveImage');
    image.style.visibility = 'hidden';
    image.onload = () => { image.style.visibility = 'visible'; };
    image.onerror = () => {
        document.getElementById('status').textContent = item.png_file + ' · Image unavailable';
    };
    image.src = '/archive/image/' + encodeURIComponent(item.png_file);

    loadMetadata(item);

    document.getElementById('previousButton').disabled =
        currentIndex <= 0;

    document.getElementById('nextButton').disabled =
        currentIndex >= archiveList.length - 1;

    updateSelectors();
    updateArchiveLinkHighlight();
}


function buildArchiveLinks()
{
    const area =
        document.getElementById('archiveLinks');

    area.innerHTML = '';

    // 日付ごとにまとめる
    const dateGroups = new Map();

    for (let i = 0; i < archiveList.length; ++i)
    {
        const info =
            parseArchiveFilename(
                archiveList[i].png_file);

        if (!info)
            continue;

        if (!dateGroups.has(info.dateKey))
        {
            dateGroups.set(
                info.dateKey,
                {
                    label: info.dateLabel,
                    items: new Map()
                });
        }

        // HHMM をキーにして実在するデータを登録
        dateGroups.get(info.dateKey).items.set(
            info.timeKey,
            {
                index: i,
                timeLabel: info.timeLabel
            });
    }


    // 新しい日付を上に表示
    const groups =
        Array.from(dateGroups.entries()).reverse();


    for (const [dateKey, group] of groups)
    {
        const dateDiv =
            document.createElement('div');

        dateDiv.className =
            'archive-date';

        dateDiv.textContent =
            group.label;

        area.appendChild(dateDiv);

        // 20時から0時まで、4時間単位
        for (let blockHour = 20;
             blockHour >= 0;
             blockHour -= 4)
        {
            const timesDiv =
                document.createElement('div');

            timesDiv.className =
                'archive-times';


            // 4時間 = 20分 × 12枠
            for (let slot = 0;
                 slot < 12;
                 ++slot)
            {
                const totalMinutes =
                    blockHour * 60 +
                    slot * 20;

                const hour =
                    Math.floor(totalMinutes / 60);

                const minute =
                    totalMinutes % 60;

                const timeKey =
                    String(hour).padStart(2, '0') +
                    String(minute).padStart(2, '0');

                const entry =
                    group.items.get(timeKey);


                if (entry)
                {
                    const link =
                        document.createElement('button');
                    link.type = 'button';

                    link.className =
                        'archive-time' + (archiveList[entry.index].quality === 'partial' ? ' partial' : '') +
                        (archiveList[entry.index].quality === 'metadata_error' ? ' metadata-error' : '');
                    link.title = qualityLabel(archiveList[entry.index]) || 'Open observation';

                    link.textContent =
                        entry.timeLabel;

                    link.dataset.index =
                        String(entry.index);

                    link.onclick =
                        () =>
                        {
                            showArchive(entry.index);
                        };

                    timesDiv.appendChild(link);
                }
                else
                {
                    const missing =
                        document.createElement('span');

                    missing.className =
                        'archive-missing';

                    missing.textContent =
                        '.....';

                    timesDiv.appendChild(missing);
                }
            }

            area.appendChild(timesDiv);
        }
    }
}

async function loadArchive(older = false)
{
    if (archiveLoading || (older && !archiveBefore)) return;
    archiveLoading = true;
    const button = document.getElementById('archiveOlder');
    const range = document.getElementById('archiveRange');
    let failed = false;
    button.disabled = true; button.textContent = 'Loading Archives…';
    button.setAttribute('data-state', 'loading');
    button.setAttribute('aria-busy', 'true');
    try {
        const cursor = older ? '?before=' + encodeURIComponent(archiveBefore) : '';
        const response = await fetch('/api/archive/list' + cursor, {cache: 'no-store'});
        const data = await response.json();
        if (!response.ok || !Array.isArray(data.items)) throw new Error(data.error || 'Invalid archive response');
        const selected = archiveList[currentIndex]?.png_file;
        const merged = new Map((older ? archiveList : []).map(item => [item.png_file, item]));
        for (const item of data.items) merged.set(item.png_file, item);
        archiveList = [...merged.values()].sort((a,b) => a.png_file.localeCompare(b.png_file));
        archiveStart = data.start_date;
        if (!older) archiveEnd = data.end_date;
        archiveBefore = data.has_more ? data.next_before : null;
        range.textContent = `${archiveStart} – ${archiveEnd} JST · ${archiveList.length} observations` +
            (!data.items.length ? ' · No data in the added 30-day period.' : '') +
            (!data.has_more ? ' · No older archives.' : '');
        populateDates(); buildArchiveLinks();
        if (archiveList.length) {
            const preserved = archiveList.findIndex(item => item.png_file === selected);
            showArchive(preserved >= 0 ? preserved : archiveList.length-1);
        } else {
            document.getElementById('status').textContent = 'No archive data in this period.';
            document.getElementById('metadata').textContent = '';
            document.getElementById('previousButton').disabled = true;
            document.getElementById('nextButton').disabled = true;
        }
    } catch (error) {
        failed = true;
        range.textContent = 'Failed to load archives. Reload the page or retry Older. ' + error.message;
    } finally {
        archiveLoading = false;
        const complete = !failed && !archiveBefore;
        button.textContent = failed ? 'Retry Loading Archives' : complete ? '✓ All Archives Loaded' : 'Load Older Archives (+30 Days)';
        button.disabled = complete;
        button.setAttribute('data-state', complete ? 'complete' : 'ready');
        button.setAttribute('aria-busy', 'false');
    }
}
document.getElementById('archiveOlder').onclick = () => loadArchive(archiveBefore !== null);

async function loadMetadata(item)
{
    const request = ++metadataRequest;
    const metadata =
        document.getElementById('metadata');
    metadata.textContent = 'Metadata: loading...';

    if (!item.json_exists)
    {
        metadata.textContent =
            'Metadata: not available';

        return;
    }

    try
    {
        const response =
            await fetch(
                '/archive/data/' +
                encodeURIComponent(item.json_file));

        if (!response.ok)
            throw new Error(`HTTP ${response.status}`);

        const data =
            await response.json();

        if (request !== metadataRequest) return;
        const frequencyMHz =
            (data.receiver.frequency_hz / 1000000)
                .toFixed(6);

        const start =
            data.observation.start_time
                .replace('T', ' ')
                .substring(0, 19);

        metadata.textContent =
            `Station: ${data.station.observer}   Location: ${data.station.location}   ` +
            `Receiver: ${data.receiver.model}   Gain: ${Number(data.receiver.gain_db).toFixed(1)}dB
` +
            `Antenna: ${data.receiver.antenna}   Frequency: ${frequencyMHz} MHz
` +
            `Start: ${start}   Received: ${data.data_quality.received_seconds}/` +
            `${data.data_quality.expected_seconds}   Missing: ${data.data_quality.missing_seconds}`;

    }
    catch (error)
    {
        console.error(error);

        if (request === metadataRequest) metadata.textContent = 'Metadata: failed to load (image is still available)';
    }
}

document.getElementById('previousButton').onclick =
    () =>
    {
        showArchive(
            currentIndex - 1);
    };


document.getElementById('nextButton').onclick =
    () =>
    {
        showArchive(
            currentIndex + 1);
    };


document.getElementById('dateSelect').onchange =
    () =>
    {
        const dateSelect =
            document.getElementById('dateSelect');

        const timeSelect =
            document.getElementById('timeSelect');

        populateTimes(
            dateSelect.value);

        if (timeSelect.options.length === 0)
            return;

        // 選択した日の最新観測を表示
        timeSelect.selectedIndex =
            timeSelect.options.length - 1;

        showArchive(
            Number(timeSelect.value));
    };


document.getElementById('timeSelect').onchange =
    () =>
    {
        const timeSelect =
            document.getElementById('timeSelect');

        showArchive(
            Number(timeSelect.value));
    };


loadArchive();
</script>
<script src="/archive/viewer.js"></script>

</body>
</html>
